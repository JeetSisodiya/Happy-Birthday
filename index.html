<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For Calalamari ✨ | A Handmade Birthday Keepsake</title>
  <!-- Tailwind CSS for layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fraunces (soft expressive editorial serif), Caveat (authentic handwritten script), Quicksand (soft rounded body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream-bg: #FFF8F3;
      --strawberry-milk: #FFE5EC;
      --butter-yellow: #FEF3C7;
      --sky-mist: #E0F2FE;
      --ink-plum: #432C39;
      --ink-soft: #7C5D6F;
      --sticker-border: #FFFDF9;
      --clay-rose: #FF8FAB;
      --clay-berry: #FB6F92;
      --clay-butter: #FDE68A;
      --clay-sage: #A7F3D0;
      --clay-lilac: #DDD6FE;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      color: var(--ink-plum);
      background-color: var(--cream-bg);
      background-image:
        radial-gradient(circle at 14% 18%, rgba(255, 214, 228, 0.75) 0%, transparent 45%),
        radial-gradient(circle at 86% 22%, rgba(254, 243, 199, 0.85) 0%, transparent 48%),
        radial-gradient(circle at 50% 88%, rgba(224, 242, 254, 0.75) 0%, transparent 52%),
        radial-gradient(#E8C5D4 1.15px, transparent 1.15px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px;
      overflow-x: hidden;
      min-height: 100vh;
      transition: filter 0.8s ease, background-color 0.8s ease;
    }

    body.twilight-afterglow {
      background-color: #231934;
      color: #FFF5F8;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(244, 114, 182, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 85%, rgba(251, 191, 36, 0.16) 0%, transparent 55%),
        radial-gradient(rgba(255, 228, 240, 0.16) 1.15px, transparent 1.15px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px;
    }

    .font-serif-soft {
      font-family: 'Fraunces', Georgia, serif;
    }

    .font-hand {
      font-family: 'Caveat', cursive;
    }

    /* Tactile Watercolor Paper Grain Overlay */
    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ==========================================================
       1. ANTI-AI ORGANIC SILHOUETTES: CLOUD BLOBS, STICKERS, TAPE
       ========================================================== */
    .cloud-island-blob {
      background: linear-gradient(155deg, rgba(255, 253, 249, 0.94) 0%, rgba(255, 240, 245, 0.92) 100%);
      border-radius: 56% 44% 48% 52% / 48% 52% 48% 52%;
      border: 6px solid var(--sticker-border);
      box-shadow:
        inset -10px -12px 24px rgba(226, 169, 191, 0.25),
        inset 10px 10px 24px rgba(255, 255, 255, 0.95),
        0 24px 48px -12px rgba(168, 104, 132, 0.22),
        0 6px 0px #F3D1DC;
      animation: liquidCloudMorph 13s ease-in-out infinite alternate;
      position: relative;
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }

    body.twilight-afterglow .cloud-island-blob {
      background: linear-gradient(155deg, rgba(52, 37, 76, 0.92) 0%, rgba(38, 26, 60, 0.94) 100%);
      border-color: rgba(255, 240, 248, 0.25);
      box-shadow:
        inset -10px -12px 24px rgba(15, 8, 28, 0.55),
        inset 6px 6px 18px rgba(255, 220, 240, 0.12),
        0 26px 55px rgba(8, 4, 18, 0.65),
        0 5px 0px rgba(255, 180, 210, 0.22);
    }

    @keyframes liquidCloudMorph {
      0% { border-radius: 54% 46% 47% 53% / 49% 52% 48% 51%; }
      50% { border-radius: 46% 54% 53% 47% / 53% 46% 54% 47%; }
      100% { border-radius: 52% 48% 44% 56% / 47% 54% 46% 53%; }
    }

    /* Die-Cut Vinyl Sticker Pill / Badge */
    .die-cut-sticker {
      background: #FFFDF9;
      border: 4.5px solid #FFFDF9;
      box-shadow:
        0 8px 18px rgba(138, 86, 112, 0.18),
        0 3px 0 rgba(214, 162, 184, 0.45);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease;
      cursor: pointer;
    }
    .die-cut-sticker:hover {
      transform: translateY(-4px) rotate(1.5deg) scale(1.04);
      box-shadow:
        0 14px 24px rgba(138, 86, 112, 0.25),
        0 4px 0 rgba(214, 162, 184, 0.55);
    }
    .die-cut-sticker:active {
      transform: translateY(2px) scale(0.96);
    }

    body.twilight-afterglow .die-cut-sticker {
      color: var(--ink-plum);
    }

    /* Translucent Washi Masking Tape Strip */
    .washi-tape {
      position: absolute;
      width: 92px;
      height: 26px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 182, 203, 0.68),
        rgba(255, 182, 203, 0.68) 8px,
        rgba(255, 235, 242, 0.72) 8px,
        rgba(255, 235, 242, 0.72) 16px
      );
      box-shadow: 0 2px 6px rgba(130, 80, 105, 0.12);
      border-left: 2px dashed rgba(255, 255, 255, 0.8);
      border-right: 2px dashed rgba(255, 255, 255, 0.8);
      pointer-events: none;
      z-index: 20;
    }

    .washi-tape.mint {
      background: repeating-linear-gradient(
        45deg,
        rgba(167, 243, 208, 0.68),
        rgba(167, 243, 208, 0.68) 8px,
        rgba(236, 253, 245, 0.75) 8px,
        rgba(236, 253, 245, 0.75) 16px
      );
    }

    /* Scalloped Postage Stamp Card */
    .postage-stamp-box {
      background: #FFFDF9;
      padding: 18px;
      position: relative;
      background-image: radial-gradient(circle at 0 50%, transparent 8px, #FFFDF9 8.5px),
                        radial-gradient(circle at 100% 50%, transparent 8px, #FFFDF9 8.5px);
      border: 4px dashed #F9A8D4;
      border-radius: 28px 34px 26px 32px;
      box-shadow: 0 20px 45px rgba(105, 58, 85, 0.25);
    }

    /* ==========================================================
       2. SQUISHY 3D PILLOW LETTERS FOR "C - A - L - A - L - A - M - A - R - I"
       ========================================================== */
    .pillow-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      width: clamp(46px, 7.2vw, 66px);
      height: clamp(54px, 8.2vw, 74px);
      margin: 4px 3px;
      cursor: pointer;
      position: relative;
      border: 4px solid #FFFDF9;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        inset -6px -8px 14px rgba(180, 75, 115, 0.28),
        inset 6px 8px 14px rgba(255, 255, 255, 0.9),
        0 12px 22px rgba(186, 104, 140, 0.28),
        0 4px 0 #FFFDF9;
    }

    /* Repeating organic pebble silhouettes & pastel clay glazes for any length name */
    .pillow-letter:nth-child(4n+1) {
      border-radius: 58% 42% 48% 52% / 50% 56% 44% 50%;
      background: linear-gradient(145deg, #FFACC5, #FF80A6);
      color: #FFF;
      transform: rotate(-4.5deg);
    }
    .pillow-letter:nth-child(4n+2) {
      border-radius: 46% 54% 52% 48% / 54% 45% 55% 46%;
      background: linear-gradient(145deg, #FDE68A, #FBBF24);
      color: #5C3D1E;
      transform: rotate(3deg) translateY(-3px);
    }
    .pillow-letter:nth-child(4n+3) {
      border-radius: 52% 48% 58% 42% / 48% 55% 45% 52%;
      background: linear-gradient(145deg, #A7F3D0, #5EEAD4);
      color: #164E46;
      transform: rotate(-2.5deg);
    }
    .pillow-letter:nth-child(4n+4) {
      border-radius: 45% 55% 46% 54% / 56% 48% 52% 44%;
      background: linear-gradient(145deg, #DDD6FE, #C084FC);
      color: #3B1D5E;
      transform: rotate(4.5deg) translateY(-2px);
    }

    /* Cute Die-Cut Luggage Tag Button for "✏️ Edit Names" */
    .luggage-tag-btn {
      position: relative;
      padding-left: 26px !important;
      background: linear-gradient(135deg, #FFFDF9 0%, #FFE4EE 100%);
      clip-path: polygon(12px 0%, 100% 0%, 100% 100%, 12px 100%, 0% 50%);
    }
    .luggage-tag-btn::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FB6F92;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    }

    .pillow-letter:hover {
      transform: translateY(-12px) scale(1.12) rotate(0deg) !important;
    }

    .pillow-pop {
      animation: squishyPop 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes squishyPop {
      0% { transform: scale(1, 1); }
      25% { transform: scale(1.28, 0.74) translateY(-10px); }
      55% { transform: scale(0.84, 1.18) translateY(-16px); }
      80% { transform: scale(1.08, 0.94) translateY(-4px); }
      100% { transform: scale(1, 1); }
    }

    /* ==========================================================
       3. ULTRA-CUTE 3D CLAY CAKE WITH EXPRESSIVE KAWAII FACE
       ========================================================== */
    .cake-stage-wrapper {
      position: relative;
      width: 310px;
      height: 280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cake-spring-body {
      position: relative;
      width: 280px;
      height: 255px;
      transform-origin: 50% 92%;
      animation: cakeBreathe 3.6s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cake-spring-body.wind-jiggle {
      animation: cakeWindJiggle 0.26s ease-in-out infinite;
    }

    @keyframes cakeBreathe {
      0%, 100% { transform: scale(1, 1) translateY(0px); }
      50% { transform: scale(1.028, 0.972) translateY(3px); }
    }

    @keyframes cakeWindJiggle {
      0% { transform: scale(1.05, 0.94) rotate(-2deg) translateX(-3px); }
      50% { transform: scale(0.96, 1.04) rotate(2.5deg) translateX(4px); }
      100% { transform: scale(1.05, 0.94) rotate(-2deg) translateX(-3px); }
    }

    /* Scalloped Ceramic Pedestal Stand */
    .ceramic-pedestal {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 266px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FFFFFF, #F3E8EE);
      border: 4px solid #FFFDF9;
      box-shadow:
        inset -6px -6px 14px rgba(173, 142, 162, 0.35),
        inset 6px 6px 12px #FFFFFF,
        0 16px 28px rgba(133, 82, 110, 0.25);
    }
    .ceramic-pedestal-foot {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 22px;
      border-radius: 14px 14px 26px 26px;
      background: linear-gradient(145deg, #FCE7F3, #F5D0FE);
      box-shadow: inset -4px -4px 8px rgba(162, 120, 155, 0.3), 0 8px 16px rgba(133, 82, 110, 0.2);
    }

    /* Bottom Strawberry Milk Tier */
    .cake-bottom-layer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 224px;
      height: 88px;
      border-radius: 34px 34px 44px 44px;
      background: linear-gradient(145deg, #FFD6E5, #FF9EBB);
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        inset -12px -12px 20px rgba(209, 75, 119, 0.32),
        inset 10px 10px 18px rgba(255, 245, 248, 0.9),
        0 10px 22px rgba(184, 72, 110, 0.25);
    }

    /* Top Buttercream Tier */
    .cake-top-layer {
      position: absolute;
      bottom: 98px;
      left: 50%;
      transform: translateX(-50%);
      width: 172px;
      height: 70px;
      border-radius: 28px 28px 34px 34px;
      background: linear-gradient(145deg, #FFFBEB, #FDE68A);
      border: 3px solid rgba(255, 255, 255, 0.88);
      box-shadow:
        inset -10px -10px 18px rgba(217, 155, 56, 0.26),
        inset 8px 8px 16px rgba(255, 255, 255, 0.95),
        0 8px 16px rgba(168, 92, 118, 0.18);
    }

    /* Whipped Cream Frosting Cap & Organic Drips */
    .whipped-frosting {
      position: absolute;
      top: -8px;
      left: -5px;
      right: -5px;
      height: 30px;
      border-radius: 28px;
      background: linear-gradient(145deg, #FFFFFF, #FFF0F5);
      box-shadow:
        inset -4px -6px 10px rgba(224, 155, 182, 0.32),
        inset 4px 4px 10px #FFFFFF,
        0 5px 10px rgba(196, 108, 142, 0.16);
    }

    .cream-drip {
      position: absolute;
      top: 16px;
      background: linear-gradient(180deg, #FFFFFF, #FFEAF2);
      border-radius: 0 0 18px 18px;
      box-shadow:
        inset -2px -3px 5px rgba(214, 138, 168, 0.28),
        0 4px 6px rgba(189, 98, 130, 0.12);
      animation: dripBob 3.2s ease-in-out infinite alternate;
    }

    @keyframes dripBob {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.08); }
    }

    /* 3D Plump Strawberries */
    .strawberry-3d {
      position: absolute;
      width: 24px;
      height: 26px;
      border-radius: 48% 52% 50% 50% / 38% 38% 62% 62%;
      background: linear-gradient(145deg, #FF758F, #E11D48);
      box-shadow:
        inset -3px -4px 6px rgba(136, 19, 55, 0.5),
        inset 3px 3px 6px rgba(255, 205, 215, 0.85),
        0 5px 10px rgba(190, 18, 60, 0.28);
      animation: berryBounce 2.8s ease-in-out infinite alternate;
    }
    .strawberry-3d::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 6px;
      width: 12px;
      height: 7px;
      border-radius: 8px;
      background: #34D399;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    @keyframes berryBounce {
      0% { transform: translateY(0) rotate(-8deg); }
      100% { transform: translateY(-3px) rotate(6deg); }
    }

    /* KAWAII EXPRESSIVE MASCOT FACE ON CAKE */
    .kawaii-eye {
      width: 15px;
      height: 17px;
      background: #3B2330;
      border-radius: 50%;
      position: relative;
      animation: eyeBlink 4.2s infinite;
      transition: all 0.2s ease;
    }
    .kawaii-eye::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: #FFFFFF;
    }
    .kawaii-eye::after {
      content: '';
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 2.5px;
      height: 2.5px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }

    /* Squinting state when wind is blown */
    .face-blowing .kawaii-eye {
      background: transparent;
      border-radius: 0;
      animation: none;
      width: 16px;
      height: 12px;
    }
    .face-blowing .kawaii-eye::before,
    .face-blowing .kawaii-eye::after {
      display: none;
    }

    /* Happy curved arc eyes after candles are blown out */
    .face-happy-arcs .kawaii-eye {
      background: transparent;
      border-top: 3.5px solid #3B2330;
      border-radius: 50% 50% 0 0;
      height: 10px;
      margin-top: 5px;
      animation: none;
    }
    .face-happy-arcs .kawaii-eye::before,
    .face-happy-arcs .kawaii-eye::after {
      display: none;
    }

    /* 3D Clay Candles & Multi-Layered Tear-Drop Flames */
    .candles-row {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      z-index: 15;
    }

    .wish-candle {
      position: relative;
      width: 20px;
      height: 56px;
      border-radius: 11px;
      cursor: pointer;
      background: repeating-linear-gradient(-38deg, #FFFDF9, #FFFDF9 7px, #FF8FAB 7px, #FF8FAB 14px);
      border: 2px solid #FFFDF9;
      box-shadow:
        inset -3px -4px 7px rgba(168, 70, 102, 0.32),
        inset 3px 3px 6px #FFFFFF,
        0 6px 12px rgba(92, 45, 68, 0.16);
      transition: transform 0.2s ease;
    }
    .wish-candle:hover {
      transform: scale(1.08) translateY(-2px);
    }
    .wish-candle.mint-candle {
      background: repeating-linear-gradient(-38deg, #FFFDF9, #FFFDF9 7px, #6EE7B7 7px, #6EE7B7 14px);
    }
    .wish-candle.lilac-candle {
      background: repeating-linear-gradient(-38deg, #FFFDF9, #FFFDF9 7px, #C4B5FD 7px, #C4B5FD 14px);
    }

    .candle-wick {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 8px;
      background: #432C39;
      border-radius: 2px;
    }

    .teardrop-flame {
      position: absolute;
      top: -38px;
      left: 50%;
      width: 22px;
      height: 34px;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      border-radius: 50% 50% 38% 38% / 64% 64% 36% 36%;
      background: radial-gradient(ellipse at 50% 80%, #60A5FA 8%, #FFFFFF 28%, #FDE047 58%, #FB923C 86%, rgba(251, 146, 60, 0) 100%);
      box-shadow:
        0 0 18px 6px rgba(253, 224, 71, 0.72),
        0 0 38px 14px rgba(251, 113, 133, 0.42);
      animation: organicFlameDance 1.3s ease-in-out infinite alternate;
      transition: opacity 0.3s ease, transform 0.1s ease-out;
    }

    .teardrop-flame.extinguished {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.05);
    }

    @keyframes organicFlameDance {
      0% { transform: translateX(-50%) scale(1, 1) rotate(-2.5deg); }
      40% { transform: translateX(-50%) scale(0.94, 1.08) rotate(2deg); }
      75% { transform: translateX(-50%) scale(1.05, 0.96) rotate(-1.5deg); }
      100% { transform: translateX(-50%) scale(0.98, 1.05) rotate(3deg); }
    }

    /* Pastel Heart Smoke Curls when Candle goes out */
    .heart-smoke {
      position: absolute;
      top: -28px;
      left: 50%;
      pointer-events: none;
      font-size: 16px;
      animation: floatSmokeHeart 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatSmokeHeart {
      0% { transform: translate(-50%, 0) scale(0.5) rotate(-10deg); opacity: 0.95; }
      50% { transform: translate(-10%, -36px) scale(1.15) rotate(12deg); opacity: 0.75; }
      100% { transform: translate(25%, -75px) scale(1.5) rotate(-8deg); opacity: 0; }
    }

    /* ==========================================================
       4. CINEMATIC DARK-BLUR EMOTIONAL STORY OVERLAY
       ========================================================== */
    #emotionalCinemaOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12, 9, 24, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #FFF8F6;
    }

    #emotionalCinemaOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Word-by-Word Glowing Pop-Up Choreography */
    .story-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px) scale(0.92);
      filter: blur(6px);
      margin-right: 0.28em;
      animation: wordSpringReveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow: 0 0 24px rgba(255, 182, 210, 0.45
